<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDV Assignment 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="stylesheets/mystyle.css">
</head>
<body>
  <h1>IDV Assignment 2</h1>

  <section>
    <!-- 001: concept map; one shared arrowhead marker, each course branch is a hoverable group -->
    <h2>Image 001: Concept Map</h2>
    <svg id="concept-map" class="focus" width="1000" height="500" viewBox="0 0 1000 500">
      <defs>
        <marker id="arrow-cm" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>

      <g id="root">
        <rect class="grey" x="400" y="45" width="200" height="78" rx="39"/>
        <text x="500" y="80">Data Driven<tspan x="500" dy="22">World</tspan></text>
        <text x="502" y="168">learns</text>
      </g>

      <g id="branch-ads" class="branch item">
        <line x1="440" y1="123" x2="200" y2="268"/>
        <rect class="course cyan" x="35" y="268" width="200" height="78"/>
        <text x="135" y="302">Algorithms and Data<tspan x="135" dy="23">Structures</tspan></text>
        <line x1="135" y1="346" x2="135" y2="434"/>
        <rect x="68" y="435" width="134" height="34"/>
        <text x="135" y="458">Week 1 to 6</text>
      </g>

      <g id="branch-oop" class="branch item">
        <line x1="480" y1="123" x2="400" y2="268"/>
        <rect class="course pink" x="280" y="268" width="200" height="78"/>
        <text x="380" y="302">Object Oriented<tspan x="380" dy="23">Programming</tspan></text>
        <line x1="380" y1="346" x2="380" y2="434"/>
        <rect x="313" y="435" width="134" height="34"/>
        <text x="380" y="458">Week 4 to 8</text>
      </g>

      <g id="branch-sm" class="branch item">
        <line x1="520" y1="123" x2="600" y2="268"/>
        <rect class="course peach" x="525" y="268" width="200" height="78"/>
        <text x="625" y="313">State Machine</text>
        <line x1="625" y1="346" x2="625" y2="434"/>
        <rect x="558" y="435" width="134" height="34"/>
        <text x="625" y="458">Week 8</text>
      </g>

      <g id="branch-ml" class="branch item">
        <line x1="560" y1="123" x2="800" y2="268"/>
        <rect class="course lime" x="770" y="268" width="200" height="78"/>
        <text x="870" y="302">Introduction to<tspan x="870" dy="23">Machine Learning</tspan></text>
        <line x1="870" y1="346" x2="870" y2="434"/>
        <rect x="803" y="435" width="134" height="34"/>
        <text x="870" y="458">Week 9 to 11</text>
      </g>
    </svg>
  </section>

  <section>
    <!-- 002: binary max-heap; nodes and edges are generated by script.js from the heap array -->
    <h2>Image 002: Binary Heap Tree</h2>
    <svg id="heap" width="600" height="380" viewBox="0 0 600 380">
      <g id="heap-edges"></g>
      <g id="heap-nodes"></g>
    </svg>
  </section>

  <section>
    <!-- 004: recursion tree for T(n) = T(n-1) + c, expanded over three columns -->
    <h2>Image 004: Recursion Tree</h2>
    <svg id="recursion" class="focus" width="516" height="336" viewBox="0 0 430 280">
      <defs>
        <marker id="arrow-rt" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>

      <g id="step-1" class="item">
        <text x="34" y="26">c</text>
        <line x1="34" y1="32" x2="34" y2="60"/>
        <text x="34" y="83">T(n-1)</text>
      </g>

      <g id="step-2" class="item">
        <text x="154" y="26">c</text>
        <line x1="154" y1="32" x2="154" y2="60"/>
        <text x="154" y="83">c</text>
        <line x1="154" y1="89" x2="154" y2="117"/>
        <text x="154" y="140">T(n-2)</text>
      </g>

      <g id="step-full" class="item">
        <text x="260" y="26">c</text>
        <line x1="260" y1="32" x2="260" y2="60"/>
        <text x="260" y="83">c</text>
        <line x1="260" y1="89" x2="260" y2="117"/>
        <text x="260" y="140">c</text>
        <line x1="260" y1="146" x2="260" y2="170"/>
        <line class="dashed" x1="260" y1="170" x2="260" y2="230"/>
        <text x="260" y="247">T(1)</text>

        <line class="arrow" x1="280" y1="22" x2="328" y2="22"/>
        <line class="arrow" x1="280" y1="79" x2="328" y2="79"/>
        <line class="arrow" x1="280" y1="136" x2="328" y2="136"/>
        <line class="arrow" x1="280" y1="243" x2="328" y2="243"/>
        <text x="342" y="26">c</text>
        <text x="342" y="83">c</text>
        <text x="342" y="140">c</text>
        <text x="342" y="247">c</text>
      </g>

      <g id="height" class="item">
        <line class="arrow span" x1="372" y1="14" x2="372" y2="252"/>
        <text x="398" y="141">n</text>
      </g>
    </svg>
  </section>

  <section>
    <!-- 007: merge step; coloured arrows point at the current position in each array -->
    <h2>Image 007: Merge Sort Arrays</h2>
    <svg id="merge" class="focus" width="540" height="250" viewBox="0 0 540 250">
      <defs>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto">
          <path class="red" d="M0,0 L10,5 L0,10 z"/>
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto">
          <path class="purple" d="M0,0 L10,5 L0,10 z"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto">
          <path class="blue" d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>

      <g id="merged" class="item">
        <title>Merged output: next write position after 14</title>
        <rect x="20" y="18" width="390" height="52"/>
        <text x="215" y="54">[<tspan class="red">1, 2, 3, 4, 7, 8, 8, 10, <tspan id="merged-last">14</tspan></tspan>]</text>
        <line class="red" data-target="merged-last" x1="347" y1="122" x2="347" y2="76" marker-end="url(#arrow-red)"/>
      </g>

      <g id="left-half" class="item">
        <title>Left array: pointer at 14</title>
        <rect x="22" y="127" width="243" height="51"/>
        <text x="143" y="162">[<tspan class="orange">7</tspan>, <tspan class="orange">8</tspan>, <tspan class="orange">10</tspan>, <tspan id="left-next" class="orange">14</tspan>, <tspan class="orange">16</tspan>]</text>
        <line class="purple" data-target="left-next" x1="174" y1="232" x2="174" y2="186" marker-end="url(#arrow-purple)"/>
      </g>

      <g id="right-half" class="item">
        <title>Right array: exhausted, pointer past the end</title>
        <rect x="311" y="127" width="176" height="51"/>
        <text x="399" y="162">[<tspan class="orange">1</tspan>, <tspan class="orange">2</tspan>, <tspan class="orange">3</tspan>, <tspan class="orange">4</tspan>, <tspan class="orange">8</tspan>]</text>
        <line class="blue" x1="500" y1="232" x2="500" y2="186" marker-end="url(#arrow-blue)"/>
      </g>
    </svg>
  </section>

  <section>
    <!-- 008: stack with push, pop and peek; blocks share one red gradient -->
    <h2>Image 008: Stack Diagram</h2>
    <svg id="stack" class="focus" width="240" height="360" viewBox="0 0 180 270">
      <defs>
        <linearGradient id="block-fill" x1="0" y1="0" x2="0" y2="1">
          <stop class="stop-light" offset="0"/>
          <stop class="stop-strong" offset="0.5"/>
        </linearGradient>
        <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10"/>
        </marker>
      </defs>

      <path class="container" d="M45,90 V237 A8,8 0 0 0 53,245 H125 A8,8 0 0 0 133,237 V90"/>
      <polygon class="base" points="55,215 92,198 129,215"/>

      <g id="push" class="item">
        <title>push: add a block on top</title>
        <rect class="block" x="8" y="8" width="72" height="25"/>
        <line x1="55" y1="42" x2="75" y2="80"/>
        <text x="30" y="72">push</text>
      </g>

      <g id="pop" class="item">
        <title>pop: remove the top block</title>
        <rect class="block" x="100" y="8" width="72" height="25"/>
        <line x1="106" y1="80" x2="126" y2="43"/>
        <text x="138" y="72">pop</text>
      </g>

      <g id="top" class="item">
        <title>peek: read the top block</title>
        <rect class="block" x="53" y="90" width="72" height="26"/>
        <text x="150" y="107">peek</text>
      </g>
      <rect class="block item" x="53" y="124" width="72" height="26"/>
      <rect class="block item" x="53" y="160" width="72" height="26"/>
    </svg>
  </section>

  <section>
    <!-- 010: directed graph; script.js trims edges to circle edges, click a vertex to isolate its edges -->
    <h2>Image 010: Directed Graph</h2>
    <svg id="graph" width="900" height="650" viewBox="0 0 900 650">
      <defs>
        <marker id="arrow-graph" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>
      <g id="graph-edges"></g>
      <g id="graph-vertices"></g>
    </svg>
  </section>

  <section>
    <!-- 014: seaborn figure-level functions and their axes-level plots, built from data by script.js -->
    <h2>Image 014: Seaborn Hierarchy</h2>
    <svg id="seaborn" class="focus" width="640" height="460" viewBox="0 0 640 460"></svg>
  </section>

  <script src="scripts/script.js"></script>
</body>
</html>
